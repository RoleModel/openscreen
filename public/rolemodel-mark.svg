<!-- The RoleModel mark: the same one the Studio shows in its sidebar and the same one
     lib/make-icon.mjs in the toolkit rasterises into this app's icon, so the tab, the
     dock and the editor's top bar cannot end up showing three different marks.

     Kept in public/ rather than src/assets/ because both a bundled component and
     index.html reference it, and public/ is the one location both can name with the
     same string. width/height are deliberately absent: every caller sizes it. -->
